<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiceOnRails</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: #0c0a09;
      color: #e7e5e4;
      font-family: 'Inter', sans-serif;
    }

    .fantasy-font {
      font-family: 'Crimson Pro', serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #1c1917;
    }

    ::-webkit-scrollbar-thumb {
      background: #44403c;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #57534e;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100%);
      }
    }

    .animate-fadeIn {
      animation: fadeIn 3s ease-out forwards;
    }

    .animate-slideUp {
      animation: slideUp 1s ease-out 0.5s forwards;

      opacity: 0;

    }

    .group:hover .animate-shimmer {
      animation: shimmer 1.5s infinite;
    }

    @keyframes glowPulse {

      0%,
      100% {
        border-color: #ca8a04;
        box-shadow: 0 0 15px rgba(202, 138, 4, 0.5);
      }

      50% {
        border-color: #0c0a09;
        box-shadow: 0 0 5px rgba(202, 138, 4, 0.1);
      }
    }

    .animate-glow-pulse {
      animation: glowPulse 2s ease-in-out infinite;
    }



    @keyframes dice-roll {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      10% { transform: translateY(-20px) rotate(36deg) scale(1.05); }
      20% { transform: translateY(5px) rotate(72deg) scale(0.95); }
      30% { transform: translateY(-15px) rotate(108deg) scale(1.03); }
      40% { transform: translateY(10px) rotate(144deg) scale(0.97); }
      50% { transform: translateY(-10px) rotate(180deg) scale(1.02); }
      60% { transform: translateY(8px) rotate(216deg) scale(0.98); }
      70% { transform: translateY(-12px) rotate(252deg) scale(1.04); }
      80% { transform: translateY(5px) rotate(288deg) scale(0.96); }
      90% { transform: translateY(-5px) rotate(324deg) scale(1.01); }
      100% { transform: translateY(0) rotate(360deg) scale(1); }
    }

    @keyframes dice-settle {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      50% { transform: rotate(-5deg); }
      75% { transform: rotate(2deg); }
      85% { transform: scale(1.08); }
      100% { transform: rotate(0deg) scale(1); }
    }

    @keyframes dice-glow-green {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      50% { box-shadow: 0 0 20px 4px rgba(34, 197, 94, 0.7); }
    }

    @keyframes dice-glow-red {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      50% { box-shadow: 0 0 20px 4px rgba(239, 68, 68, 0.7); }
    }

    @keyframes dice-number-cycle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .animate-dice-roll { animation: dice-roll 1.2s ease-in-out; }
    .animate-dice-settle { animation: dice-settle 0.4s ease-out; }
    .animate-dice-glow-green { animation: dice-glow-green 0.6s ease-out; }
    .animate-dice-glow-red { animation: dice-glow-red 0.6s ease-out; }


    .markdown-content>*:first-child {
      margin-top: 0;
    }

    .markdown-content>*:last-child {
      margin-bottom: 0;
    }

    .markdown-content p {
      margin-bottom: 0.75em;
    }

    .markdown-content ul {
      list-style-type: disc;
      padding-left: 1.5em;
      margin-bottom: 0.75em;
    }

    .markdown-content ol {
      list-style-type: decimal;
      padding-left: 1.5em;
      margin-bottom: 0.75em;
    }

    .markdown-content li {
      margin-bottom: 0.25em;
    }

    .markdown-content strong {
      font-weight: 700;
      color: #fbbf24;

    }

    .markdown-content em {
      font-style: italic;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4 {
      font-weight: 700;
      color: #f59e0b;
      margin-top: 1em;
      margin-bottom: 0.5em;
      line-height: 1.2;
    }

    .markdown-content h1 {
      font-size: 1.5em;
    }

    .markdown-content h2 {
      font-size: 1.25em;
    }

    .markdown-content h3 {
      font-size: 1.1em;
    }

    .markdown-content code {
      background-color: rgba(28, 25, 23, 0.5);

      padding: 0.2em 0.4em;
      border-radius: 0.25em;
      font-family: monospace;
      font-size: 0.9em;
      color: #a7f3d0;

    }

    .markdown-content pre {
      background-color: rgba(12, 10, 9, 0.5);

      padding: 1em;
      border-radius: 0.5em;
      overflow-x: auto;
      margin-bottom: 0.75em;
      border: 1px solid rgba(68, 64, 60, 0.3);

    }

    .markdown-content pre code {
      background-color: transparent;
      padding: 0;
      color: #e7e5e4;

    }

    .markdown-content blockquote {
      border-left: 4px solid #f59e0b;
      /* amber-500 */
      padding-left: 1em;
      margin-left: 0;
      margin-right: 0;
      font-style: italic;
      color: #a8a29e;

      margin-bottom: 0.75em;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
